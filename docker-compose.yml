services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  catalog-seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["npm", "run", "seed"]
    restart: "no"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/component_request_triage}
    depends_on:
      mongodb:
        condition: service_healthy

  analysis:
    build: ./analysis
    restart: unless-stopped
    ports:
      - "${ANALYSIS_PORT:-8000}:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/component_request_triage}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-component_request_triage}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.35}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
    depends_on:
      mongodb:
        condition: service_healthy
      catalog-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/component_request_triage}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ANALYSIS_SERVICE_URL: http://analysis:8000
      ANALYSIS_POLL_INTERVAL_MS: ${ANALYSIS_POLL_INTERVAL_MS:-1000}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-5}
      ANALYSIS_RETRY_BASE_DELAY_MS: ${ANALYSIS_RETRY_BASE_DELAY_MS:-5000}
      ANALYSIS_RETRY_MAX_DELAY_MS: ${ANALYSIS_RETRY_MAX_DELAY_MS:-300000}
      ANALYSIS_LEASE_DURATION_MS: ${ANALYSIS_LEASE_DURATION_MS:-60000}
      ANALYSIS_REQUEST_TIMEOUT_MS: ${ANALYSIS_REQUEST_TIMEOUT_MS:-20000}
    depends_on:
      mongodb:
        condition: service_healthy
      catalog-seed:
        condition: service_completed_successfully
      analysis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
